[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai_platform"]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.ruff]
extend-exclude = ["scripts"]

[tool.ruff.lint]
ignore = ["UP007", "UP045"]

[tool.ruff.lint.per-file-ignores]
"db/migrations/versions/*.py" = ["F401"]

[project]
name = "ocean-intelligence"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "boto3>=1.43.67",
    "chainlit>=2.11.1",
    "fastapi>=0.141.1",
    "greenlet>=3.5.4",
    "langchain>=1.0.0",
    "langchain-openai>=1.6.0",
    "langfuse>=3.0.0",
    "langgraph>=1.2.11",
    "openai>=2.53.0",
    "python-dotenv>=1.2.2",
    "sqlalchemy[asyncio]>=2.0.51",
    "tiktoken>=0.14.0",
    "uvicorn[standard]>=0.52.1",
]

[dependency-groups]
dev = [
    "ruff>=0.16.2",
]
glue = [
    "boto3>=1.34.0",
    "openpyxl>=3.1.5",
    "pandas>=2.2.0",
    "pyspark>=3.5.0",
]
gold = [
    "boto3>=1.34.0",
    "pg8000>=1.31.5",
]
