<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ocean Intelligence</title>
    <link rel="icon" href="/chat/public/favicon.svg" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #0d0d0d;
        --muted: #5c5c5c;
        --card: #f6f7f8;
        --border: #e3e5e8;
        --accent: #0f766e;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #212121;
          --fg: #ededed;
          --muted: #b4b4b4;
          --card: #2f2f2f;
          --border: #424242;
          --accent: #2dd4bf;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main { max-width: 60rem; margin: 0 auto; padding: 3rem 1.5rem; }
      header { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
      h1 { font-size: 1.5rem; margin: 0; letter-spacing: -0.01em; }
      p.sub { color: var(--muted); margin: 0.25rem 0 2rem; }
      a.cta {
        display: inline-block; padding: 0.6rem 1.1rem; border-radius: 0.6rem;
        background: var(--accent); color: #fff; text-decoration: none; font-weight: 600;
      }
      .grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr)); }
      .tile { background: var(--card); border: 1px solid var(--border); border-radius: 0.75rem; padding: 1.1rem; }
      .tile .label { color: var(--muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; }
      .tile .value { font-size: 2rem; font-weight: 650; font-variant-numeric: tabular-nums; margin-top: 0.35rem; }
      .env { font-size: 0.8rem; color: var(--muted); margin-top: 1.5rem; }
      .env code { background: var(--card); border: 1px solid var(--border); padding: 0.1rem 0.4rem; border-radius: 0.35rem; }
      .error { color: #b91c1c; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Ocean Intelligence</h1>
          <p class="sub">Chat persistence overview</p>
        </div>
        <a class="cta" href="/chat">Open chat</a>
      </header>

      <div class="grid" id="tiles"></div>
      <p class="env" id="env"></p>
    </main>

    <script>
      const TILES = [
        ["users", "Users"],
        ["threads", "Threads"],
        ["steps", "Steps"],
        ["feedbacks", "Feedback"],
      ];

      async function load() {
        const tiles = document.getElementById("tiles");
        const env = document.getElementById("env");
        try {
          const response = await fetch("/api/stats");
          if (!response.ok) throw new Error("HTTP " + response.status);
          const data = await response.json();
          tiles.innerHTML = TILES.map(
            ([key, label]) =>
              `<div class="tile"><div class="label">${label}</div><div class="value">${data.counts[key]}</div></div>`
          ).join("");
          env.innerHTML = `Environment schema <code>${data.schema}</code>`;
        } catch (error) {
          env.innerHTML = `<span class="error">Could not load stats: ${error.message}</span>`;
        }
      }

      load();
    </script>
  </body>
</html>
