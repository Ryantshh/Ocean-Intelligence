name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v4.1.0

  migrations:
    runs-on: ubuntu-latest
    env:
      CHAINLIT_DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci
      CHAINLIT_DB_SCHEMA: dev
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run alembic upgrade head --sql
